blueprint:
  name: "Baby Tracker – feeding reminder"
  description: >-
    When the next feeding time arrives with no new feeding logged, asks on your phones whether the baby ate:
    "Yes, finished what was left" or "Yes, with details…" (type the amount and/or the real time, e.g. "1.5",
    "20:15 1.5", "40 min ago", "new 2"). Repeats until a feeding is logged. Requires
    "Baby Tracker – notification buttons" to handle the answers.
  domain: automation
  source_url: https://github.com/HertBox/ha-baby-tracker/blob/main/blueprints/automation/baby_tracker/reminder.yaml
  input:
    next:
      name: "Next feeding sensor"
      description: "The baby's \"Next feeding\" sensor (e.g. sensor.<name>_next_feeding)."
      selector:
        entity:
          filter:
            - integration: baby_tracker
              domain: sensor
              device_class: timestamp
    last:
      name: "Last feeding sensor"
      description: "The baby's \"Last feeding\" sensor."
      selector:
        entity:
          filter:
            - integration: baby_tracker
              domain: sensor
              device_class: timestamp
    repetir_min:
      name: Repeat every (minutes)
      default: 30
      selector:
        number: {min: 10, max: 120, unit_of_measurement: min}
    repeticiones:
      name: Maximum reminders
      default: 4
      selector:
        number: {min: 1, max: 10}
    phones:
      name: Phones to notify
      default: []
      selector:
        device:
          integration: mobile_app
          multiple: true

mode: restart

triggers:
  - trigger: time
    at: !input next

variables:
  last: !input last
  repetir_min: !input repetir_min
  repeticiones: !input repeticiones
  phones: !input phones
  services: >-
    {{ phones | map('device_attr', 'name') | map('slugify') | map('regex_replace', '^', 'notify.mobile_app_') | list }}
  last_id: "{{ state_attr(last, 'id') }}"
  baby: "{{ state_attr(last, 'baby_id') or '' }}"
  name: "{{ state_attr(last, 'name') or 'the baby' }}"
  u: "{{ state_attr(last, 'unit') or 'oz' }}"

conditions:
  - condition: template
    value_template: "{{ last_id is not none }}"

actions:
  - repeat:
      sequence:
        - repeat:
            for_each: "{{ services }}"
            sequence:
              - action: "{{ repeat.item }}"
                continue_on_error: true
                data:
                  title: "🍼 Has {{ name }} eaten?"
                  message: >-
                    {%- macro c(v) -%}{{ ((v|float(0))*29.5735)|round(0)|int ~ ' ml' if u == 'ml' else ('%g' % (v|float(0))) ~ ' oz' }}{%- endmacro -%}
                    {% set m = ((as_timestamp(now()) - as_timestamp(states(last))) / 60) | int %}
                    {{ 'It has been' }} {{ m // 60 }} h {{ '%02d' % (m % 60) }} min
                    {{ 'since the last feeding' }} ({{ as_timestamp(states(last)) | timestamp_custom('%H:%M') }}, {{ c(state_attr(last, 'oz_taken')) }}).
                  data:
                    tag: "baby_reminder_{{ baby }}"
                    push:
                      interruption-level: time-sensitive
                    actions:
                      - action: "BABY_ATE_0__{{ baby }}"
                        title: "{{ 'Yes, finished what was left' }}"
                      - action: "BABY_DETAILS_0_{{ u }}__{{ baby }}"
                        title: "{{ 'Yes, with details…' }}"
                        behavior: textInput
                        textInputButtonTitle: "{{ 'Log' }}"
                        textInputPlaceholder: "{{ '1.5 · 20:15 1.5 · 40 min ago · new 2' }}"
                      - action: "BABY_NOTYET_0__{{ baby }}"
                        title: "{{ 'Not yet' }}"
        - wait_for_trigger:
            - trigger: template
              value_template: "{{ state_attr(last, 'id') != last_id }}"
          timeout:
            minutes: "{{ repetir_min | int }}"
          continue_on_timeout: true
      until: "{{ state_attr(last, 'id') != last_id or repeat.index >= (repeticiones | int) }}"
  - repeat:
      for_each: "{{ services }}"
      sequence:
        - action: "{{ repeat.item }}"
          continue_on_error: true
          data:
            message: clear_notification
            data:
              tag: "baby_reminder_{{ baby }}"
