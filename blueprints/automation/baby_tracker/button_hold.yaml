blueprint:
  name: "Baby Tracker – button hold starts a new bottle"
  description: >-
    A long press (or any trigger you choose) starts a new bottle of the usual size; the previous one is left
    incomplete and its remainder counts as wasted. Sends a notification with an Undo button
    (requires "Baby Tracker – notification buttons").
  domain: automation
  source_url: https://github.com/HertBox/ha-baby-tracker/blob/main/blueprints/automation/baby_tracker/button_hold.yaml
  input:
    disparador:
      name: Hold trigger
      description: "The trigger for a long press of your button."
      selector:
        trigger: {}
    baby:
      name: Baby
      description: Only needed if you track more than one baby.
      default: ""
      selector:
        config_entry:
          integration: baby_tracker
    phones:
      name: Phones to notify
      default: []
      selector:
        device:
          integration: mobile_app
          multiple: true

mode: single
max_exceeded: silent

triggers: !input disparador

variables:
  baby: !input baby
  phones: !input phones
  services: >-
    {{ phones | map('device_attr', 'name') | map('slugify') | map('regex_replace', '^', 'notify.mobile_app_') | list }}

actions:
  - action: baby_tracker.new_bottle
    data:
      baby: "{{ baby }}"
    response_variable: r
  - variables:
      u: "{{ r.unit }}"
  - repeat:
      for_each: "{{ services }}"
      sequence:
        - action: "{{ repeat.item }}"
          continue_on_error: true
          data:
            title: >-
              {%- macro c(v) -%}{{ ((v|float(0))*29.5735)|round(0)|int ~ ' ml' if u == 'ml' else ('%g' % (v|float(0))) ~ ' oz' }}{%- endmacro -%}
              🍼 {{ 'New bottle' }} · {{ r.name }} ({{ c(r.bottle.oz) }})
            message: >-
              {%- macro c(v) -%}{{ ((v|float(0))*29.5735)|round(0)|int ~ ' ml' if u == 'ml' else ('%g' % (v|float(0))) ~ ' oz' }}{%- endmacro -%}
              {% set a = r.previous if r.previous is mapping else {} %}
              {%- if a -%}{{ 'Previous' }}: {{ c(a.consumed) }} / {{ c(a.oz) }}{%- if a.state == 'incomplete' %} ({{ 'wasted' }} {{ c(a.remaining) }}){% endif %}{%- else -%}{{ 'Ready.' }}{%- endif -%}
            data:
              tag: "baby_bottle_{{ r.baby }}"
              actions:
                - action: "BABY_UNDOBOTTLE_{{ r.bottle.id }}__{{ r.baby }}"
                  title: "{{ 'Undo' }}"
